title: AI Coding Agent Launched From an npm Package Install Script
id: 0898c6b6-a8a9-4f6b-96ae-28e74a62ab21
status: experimental
description: |
    Detects Claude Code or the OpenAI Codex CLI starting with a working directory inside
    node_modules. npm runs a package's install scripts from the package's own folder in
    node_modules, so an agent starting there was almost certainly launched by a dependency's
    install script, as in the s1ngularity attack on the Nx packages (August 2025).
    Requires Sysmon event 1 (Security 4688 does not record the working directory).
references:
    - https://github.com/nrwl/nx/security/advisories/GHSA-cxm3-wv7p-598c
    - https://www.wiz.io/blog/s1ngularity-supply-chain-attack
    - https://docs.npmjs.com/cli/using-npm/scripts
    - https://github.com/yug3009p/agent-attack-samples
author: Yug Patel
date: 2026-11-04
tags:
    - attack.initial-access
    - attack.t1195.002
    - attack.execution
    - attack.t1059
logsource:
    category: process_creation
    product: windows
detection:
    selection_agent_image:
        Image|endswith:
            - '\claude.exe'
            - '\codex.exe'
    selection_agent_wrapper:
        CommandLine|contains:
            - '\@anthropic-ai\claude-code\'
            - '\@openai\codex\'
    selection_cwd:
        CurrentDirectory|contains: '\node_modules\'
    condition: 1 of selection_agent_* and selection_cwd
falsepositives:
    - A developer deliberately starting an agent from inside a node_modules folder (unusual).
level: high
